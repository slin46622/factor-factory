[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-factory"
version = "0.1.0"
description = "LLM-driven alpha factor factory for China A-shares — propose → validate (IC) → tier → library, with an always-on daemon. Inspired by Microsoft RD-Agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Factor Factory Contributors" }]
keywords = ["quant", "alpha", "factors", "a-share", "qlib", "llm", "rd-agent"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "pyqlib>=0.9.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
akshare = ["akshare>=1.10"]

[project.scripts]
factor-factory-daemon = "factor_factory.daemon:main"
factor-factory-dashboard = "factor_factory.dashboard:main_once"
factor-factory-decay = "factor_factory.decay:main"

[tool.setuptools.packages.find]
where = ["src"]
